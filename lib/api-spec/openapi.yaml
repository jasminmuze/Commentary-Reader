openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bookmarks - Social Ebook Reader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: books
    description: Book operations
  - name: quotes
    description: Quote operations
  - name: comments
    description: Comment operations
  - name: library
    description: User library / uploaded EPUB operations
  - name: users
    description: User operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /books:
    get:
      operationId: listBooks
      tags: [books]
      summary: List / search canonical books
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
    post:
      operationId: createBook
      tags: [books]
      summary: Create a canonical book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookInput"
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"

  /books/{bookId}:
    get:
      operationId: getBook
      tags: [books]
      summary: Get a book with its best comments and most-highlighted quotes
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "404":
          description: Book not found

  /books/{bookId}/quotes:
    get:
      operationId: getBookQuotes
      tags: [quotes]
      summary: Community quotes for a book (reader overlay)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Quotes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Find or create a quote in a book (by normalized text)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteInput"
      responses:
        "200":
          description: Quote found or created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{quoteId}/comments:
    get:
      operationId: getQuoteComments
      tags: [comments]
      summary: Get top-level comments for a quote
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: integer
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [best, friends, all]
            default: all
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Create a comment on a quote (parses @mentions and fires notifications)
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /quotes/{quoteId}/highlight:
    post:
      operationId: toggleHighlight
      tags: [quotes]
      summary: Toggle the current user's highlight on a quote
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HighlightInput"
      responses:
        "200":
          description: Highlight toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighlightResult"

  /quotes/{quoteId}/reader-context:
    get:
      operationId: getQuoteReaderContext
      tags: [quotes]
      summary: Where to read this quote — its canonical book and my library entry (if any)
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reader context for the quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteReaderContext"
        "404":
          description: Quote not found

  /comments/{commentId}/like:
    post:
      operationId: likeComment
      tags: [comments]
      summary: Like a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  /comments/{commentId}/save:
    post:
      operationId: saveComment
      tags: [comments]
      summary: Save/unsave a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Save toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"

  /comments/{commentId}:
    get:
      operationId: getComment
      tags: [comments]
      summary: Get a single comment by id (visibility-gated)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Comment not found or not visible

  /comments/{commentId}/replies:
    get:
      operationId: getCommentReplies
      tags: [comments]
      summary: Get replies to a top-level comment (flat, chronological, visibility-gated)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Replies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createReply
      tags: [comments]
      summary: Reply to a top-level comment (max 1 level; parses @mentions and fires notifications)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /library:
    post:
      operationId: createLibraryEntry
      tags: [library]
      summary: Register an uploaded EPUB, extract metadata, and auto-match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryInput"
      responses:
        "201":
          description: Library entry created with match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryUploadResult"

  /library/{libraryId}:
    get:
      operationId: getLibraryEntry
      tags: [library]
      summary: Get a library entry (with EPUB url and matched book)
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Library entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"
        "404":
          description: Not found
    patch:
      operationId: matchLibraryEntry
      tags: [library]
      summary: Manually match a library entry to a canonical book
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualMatchInput"
      responses:
        "200":
          description: Library entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"

  /library/{libraryId}/location:
    put:
      operationId: updateReadingLocation
      tags: [library]
      summary: Save the reader's last reading location (CFI)
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadingLocationInput"
      responses:
        "200":
          description: Library entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"
        "404":
          description: Not found

  /users/{userId}/library:
    get:
      operationId: getUserLibrary
      tags: [library]
      summary: List a user's uploaded books
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Library entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryEntry"

  /users:
    post:
      operationId: createUser
      tags: [users]
      summary: Sign up a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username already taken

  /users/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Log in with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user with bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid username or password

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search users by username (viewer taken from bearer token)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserWithFriendStatus"

  /users/{userId}/friends:
    get:
      operationId: getFriends
      tags: [users]
      summary: Get friends of a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Friends list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: addFriend
      tags: [users]
      summary: Add a friend
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendInput"
      responses:
        "200":
          description: Friend added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/friends/{friendId}:
    delete:
      operationId: removeFriend
      tags: [users]
      summary: Remove a friend
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: friendId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Friend removed

  /friend-requests:
    post:
      operationId: sendFriendRequest
      tags: [users]
      summary: Send a friend request (requester taken from bearer token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestInput"
      responses:
        "200":
          description: Request created (idempotent — ok even if already pending or already friends)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Cannot send a friend request to yourself
        "404":
          description: Recipient not found

  /friend-requests/{requesterId}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [users]
      summary: Accept a pending friend request sent to the authenticated user
      parameters:
        - name: requesterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request accepted — both users now follow each other
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: No pending request from this user

  /friend-requests/{requesterId}/decline:
    post:
      operationId: declineFriendRequest
      tags: [users]
      summary: Decline a pending friend request sent to the authenticated user
      parameters:
        - name: requesterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request declined (removed; the requester may request again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: No pending request from this user

  /users/{userId}/saved-comments:
    get:
      operationId: getSavedComments
      tags: [users]
      summary: Get saved comments for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

  /users/{userId}/records:
    get:
      operationId: getUserRecords
      tags: [users]
      summary: My records grouped by book (my highlight/comment/saved counts; self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-book record summaries, most recent activity first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRecordsBook"

  /users/{userId}/records/{bookId}:
    get:
      operationId: getUserBookRecords
      tags: [users]
      summary: My highlights, comments, and saved comments for one book (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: My records for this book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBookRecords"
        "404":
          description: Book not found

  /users/{userId}/highlights:
    get:
      operationId: getUserHighlights
      tags: [users]
      summary: All my highlights across books, newest first (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: My highlights, chronological (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserHighlightItem"

  /users/{userId}/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a user's public profile with follower/following and activity counts
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found

  /users/{userId}/settings:
    patch:
      operationId: updateUserSettings
      tags: [users]
      summary: Update the current user's personal settings
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserSettings"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/notifications:
    get:
      operationId: getNotifications
      tags: [users]
      summary: Get notifications for a user (newest first, limit 50)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification list with unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /users/{userId}/notifications/read-all:
    put:
      operationId: markNotificationsRead
      tags: [users]
      summary: Mark all notifications as read
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unread count after marking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/{notificationId}/read:
    put:
      operationId: markNotificationRead
      tags: [users]
      summary: Mark a single notification as read (must belong to the authenticated user)
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unread count after marking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "404":
          description: Notification not found

  /users/{userId}/push-tokens:
    post:
      operationId: registerPushToken
      tags: [users]
      summary: Register an Expo push token for the user (upsert; reassigns the token on account switch)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
    delete:
      operationId: unregisterPushToken
      tags: [users]
      summary: Unregister an Expo push token for the user (e.g. on logout)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "200":
          description: Token unregistered (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /highlights/{highlightId}/like:
    post:
      operationId: likeHighlight
      tags: [quotes]
      summary: Toggle a like on a highlight (liker taken from bearer token)
      parameters:
        - name: highlightId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "404":
          description: Highlight not found

  /users/{userId}/notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [users]
      summary: Get the current user's per-type notification settings (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
    put:
      operationId: updateNotificationSettings
      tags: [users]
      summary: Update the current user's per-type notification settings (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettings"
      responses:
        "200":
          description: Updated notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"

  /feed:
    get:
      operationId: getFeed
      tags: [users]
      summary: Activity feed of users I follow (highlights + comments, newest first, viewer taken from bearer token)
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous page's nextCursor. Omit for the first page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Book:
      type: object
      required: [id, title, author, description, coverColor, quoteCount, commentCount, highlightCount]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        description:
          type: string
        coverColor:
          type: string
        quoteCount:
          type: integer
        commentCount:
          type: integer
        highlightCount:
          type: integer

    Quote:
      type: object
      required: [id, canonicalBookId, text, searchText, highlightCount, commentCount, highlightIntensity]
      properties:
        id:
          type: integer
        canonicalBookId:
          type: integer
        text:
          type: string
        searchText:
          type: string
          description: Distinctive leading substring used to locate the quote in an EPUB
        highlightCount:
          type: integer
        commentCount:
          type: integer
        highlightIntensity:
          type: number
          description: 0.0 to 1.0 representing community highlight strength
        highlightedByMe:
          type: boolean

    QuoteReaderContext:
      type: object
      required: [quoteId, canonicalBookId, quoteText, searchText, libraryId]
      properties:
        quoteId:
          type: integer
        canonicalBookId:
          type: integer
        quoteText:
          type: string
        searchText:
          type: string
          description: Distinctive leading substring used to locate the quote in an EPUB
        libraryId:
          type: [integer, "null"]
          description: The viewer's library entry for this book, or null if not in their library

    BookDetail:
      type: object
      required: [id, title, author, description, coverColor, quoteCount, commentCount, highlightCount, topQuotes, bestComments]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        description:
          type: string
        coverColor:
          type: string
        quoteCount:
          type: integer
        commentCount:
          type: integer
        highlightCount:
          type: integer
        topQuotes:
          type: array
          items:
            $ref: "#/components/schemas/Quote"
        bestComments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    Comment:
      type: object
      required: [id, quoteId, userId, username, avatarColor, text, visibility, likeCount, likedByMe, savedByMe, replyCount, createdAt]
      properties:
        id:
          type: integer
        quoteId:
          type: integer
        userId:
          type: integer
        username:
          type: string
        avatarColor:
          type: string
        text:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"
        quoteText:
          type: string
        likeCount:
          type: integer
        likedByMe:
          type: boolean
        savedByMe:
          type: boolean
        replyCount:
          type: integer
          description: Number of visible replies (0 for replies themselves)
        parentId:
          type: [integer, "null"]
          description: ID of the parent comment for replies; null for top-level comments
        createdAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        visibility:
          $ref: "#/components/schemas/Visibility"

    CreateQuoteInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 8
          maxLength: 1000

    HighlightInput:
      type: object
      properties:
        userLibraryId:
          type: integer
        cfiRange:
          type: string
        visibility:
          $ref: "#/components/schemas/Visibility"

    HighlightResult:
      type: object
      required: [highlighted, highlightCount]
      properties:
        highlighted:
          type: boolean
        highlightCount:
          type: integer

    CreateBookInput:
      type: object
      required: [title, author]
      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        description:
          type: string
        isbn:
          type: string

    CreateLibraryInput:
      type: object
      required: [uploadURL]
      properties:
        uploadURL:
          type: string
          description: The presigned upload URL (or object path) returned after upload

    ManualMatchInput:
      type: object
      required: [canonicalBookId]
      properties:
        canonicalBookId:
          type: integer

    LibraryEntry:
      type: object
      required: [id, userId, canonicalBookId, epubObjectPath, epubUrl, originalTitle, originalAuthor, originalIsbn, lastReadingLocation, createdAt, book]
      properties:
        id:
          type: integer
        userId:
          type: integer
        canonicalBookId:
          type: [integer, "null"]
        epubObjectPath:
          type: string
        epubUrl:
          type: string
        originalTitle:
          type: [string, "null"]
        originalAuthor:
          type: [string, "null"]
        originalIsbn:
          type: [string, "null"]
        lastReadingLocation:
          type: [string, "null"]
        readingProgress:
          type: [integer, "null"]
          minimum: 0
          maximum: 100
        createdAt:
          type: string
          format: date-time
        book:
          oneOf:
            - $ref: "#/components/schemas/Book"
            - type: "null"

    UpdateReadingLocationInput:
      type: object
      required: [location]
      properties:
        location:
          type: string
          minLength: 1
        readingProgress:
          type: integer
          minimum: 0
          maximum: 100

    MatchResult:
      type: object
      required: [status, book, candidates]
      properties:
        status:
          type: string
          enum: [matched, candidates, none]
        book:
          oneOf:
            - $ref: "#/components/schemas/Book"
            - type: "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Book"

    LibraryUploadResult:
      type: object
      required: [entry, match]
      properties:
        entry:
          $ref: "#/components/schemas/LibraryEntry"
        match:
          $ref: "#/components/schemas/MatchResult"

    LikeResult:
      type: object
      required: [liked, likeCount]
      properties:
        liked:
          type: boolean
        likeCount:
          type: integer

    SaveResult:
      type: object
      required: [saved]
      properties:
        saved:
          type: boolean

    UserRef:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer

    Visibility:
      type: string
      enum: [public, friends, private]
      description: Who can see a comment or highlight — public, friends (mutual follows), or private (author only)

    User:
      type: object
      required: [id, username, avatarColor, defaultVisibility, createdAt]
      properties:
        id:
          type: integer
        username:
          type: string
        avatarColor:
          type: string
        defaultVisibility:
          $ref: "#/components/schemas/Visibility"
        createdAt:
          type: string
          format: date-time
        token:
          type: string
          description: HMAC-signed bearer token — only present in POST /users and POST /users/login responses

    UserProfile:
      type: object
      required:
        [
          id,
          username,
          avatarColor,
          createdAt,
          followerCount,
          followingCount,
          highlightCount,
          commentCount,
          isFollowedByMe,
          followsMe,
          isMe,
          friendStatus,
        ]
      properties:
        id:
          type: integer
        username:
          type: string
        avatarColor:
          type: string
        createdAt:
          type: string
          format: date-time
        followerCount:
          type: integer
        followingCount:
          type: integer
        highlightCount:
          type: integer
        commentCount:
          type: integer
        isFollowedByMe:
          type: boolean
          description: Whether the requesting user follows this profile
        followsMe:
          type: boolean
          description: Whether this profile follows the requesting user
        isMe:
          type: boolean
          description: Whether this profile is the requesting user
        friendStatus:
          type: string
          enum: [none, requested, incoming, friends]
          description: >-
            Friend relationship between the viewer and this profile:
            none = no relationship, requested = viewer sent a pending request,
            incoming = this profile sent the viewer a pending request,
            friends = mutual follow (friends). Always "none" on your own profile.

    UpdateUserSettings:
      type: object
      required: [defaultVisibility]
      properties:
        defaultVisibility:
          $ref: "#/components/schemas/Visibility"

    NotificationSettings:
      type: object
      required: [likes, replies, mentions, friends]
      properties:
        likes:
          type: boolean
          description: Notify when someone likes my highlight or comment
        replies:
          type: boolean
          description: Notify when someone replies to my comment
        mentions:
          type: boolean
          description: Notify when someone @mentions me
        friends:
          type: boolean
          description: Notify on friend requests and accepts

    UserWithFriendStatus:
      type: object
      required: [id, username, avatarColor, createdAt, isFriend]
      properties:
        id:
          type: integer
        username:
          type: string
        avatarColor:
          type: string
        createdAt:
          type: string
          format: date-time
        isFriend:
          type: boolean

    UserInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 2
        password:
          type: string
          minLength: 8
          maxLength: 100

    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    FriendInput:
      type: object
      required: [friendId]
      properties:
        friendId:
          type: integer

    FriendRequestInput:
      type: object
      required: [recipientId]
      properties:
        recipientId:
          type: integer

    NotificationItem:
      type: object
      required: [id, type, actorId, actorUsername, actorAvatarColor, commentId, commentText, parentCommentId, quoteId, read, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [reply, mention, friend_request, friend_accept, highlight_like, comment_like]
          description: "reply = someone replied to your comment; mention = you were @mentioned; friend_request = someone sent you a friend request; friend_accept = your friend request was accepted; highlight_like = someone liked your highlight; comment_like = someone liked your comment"
        actorId:
          type: integer
        actorUsername:
          type: string
        actorAvatarColor:
          type: string
        commentId:
          type: integer
          description: The reply comment that triggered the notification (0 for friend_* notifications)
        commentText:
          type: string
          description: Preview of the reply text
        parentCommentId:
          type: [integer, "null"]
          description: The original top-level comment (null for mention-only notifications)
        quoteId:
          type: integer
        quoteText:
          type: string
          description: The quote text for navigation context
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time

    NotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications:
          type: array
          items:
            $ref: "#/components/schemas/NotificationItem"
        unreadCount:
          type: integer

    UnreadCount:
      type: object
      required: [unreadCount]
      properties:
        unreadCount:
          type: integer

    PushTokenInput:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Expo push token, e.g. ExponentPushToken[xxxxxxxx]

    OkResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    UserRecordsBook:
      type: object
      required: [bookId, title, author, coverColor, highlightCount, commentCount, savedCount]
      properties:
        bookId:
          type: integer
        title:
          type: string
        author:
          type: string
        coverColor:
          type: string
        highlightCount:
          type: integer
          description: Number of my highlights in this book
        commentCount:
          type: integer
          description: Number of my comments in this book
        savedCount:
          type: integer
          description: Number of comments I saved in this book

    UserHighlightItem:
      type: object
      required: [id, quoteId, bookId, bookTitle, bookAuthor, coverColor, quoteText, createdAt]
      properties:
        id:
          type: integer
        quoteId:
          type: integer
        bookId:
          type: integer
        bookTitle:
          type: string
        bookAuthor:
          type: string
        coverColor:
          type: string
        quoteText:
          type: string
        createdAt:
          type: string
          format: date-time

    UserBookRecords:
      type: object
      required: [book, highlights, comments, savedComments]
      properties:
        book:
          $ref: "#/components/schemas/UserRecordsBook"
        highlights:
          type: array
          items:
            $ref: "#/components/schemas/UserHighlightItem"
        comments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"
        savedComments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    FeedItem:
      type: object
      required: [type, id, userId, username, avatarColor, bookId, bookTitle, bookAuthor, coverColor, quoteId, quoteText, quoteTextTruncated, likeCount, likedByMe, createdAt]
      properties:
        type:
          type: string
          enum: [highlight, comment]
        id:
          type: integer
          description: Highlight id or comment id depending on type
        userId:
          type: integer
        username:
          type: string
        avatarColor:
          type: string
        bookId:
          type: integer
        bookTitle:
          type: string
        bookAuthor:
          type: string
        coverColor:
          type: string
        quoteId:
          type: integer
        quoteText:
          type: string
          description: Quote text — truncated to a preview length unless the viewer owns the book
        quoteTextTruncated:
          type: boolean
          description: Whether quoteText was truncated for copyright protection
        commentText:
          type: string
          description: Present only when type is comment
        likeCount:
          type: integer
          description: Number of likes on this highlight or comment
        likedByMe:
          type: boolean
          description: Whether the viewer has liked this item
        createdAt:
          type: string
          format: date-time

    FeedPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/FeedItem"
        nextCursor:
          type: [string, "null"]
          description: Pass as cursor to fetch the next page; null when there are no more items
