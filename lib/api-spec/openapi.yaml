openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Bookmarks - Social Ebook Reader API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: books
    description: Book operations
  - name: quotes
    description: Quote operations
  - name: comments
    description: Comment operations
  - name: library
    description: User library / uploaded EPUB operations
  - name: users
    description: User operations
  - name: rooms
    description: Reading room (book club) operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /books:
    get:
      operationId: listBooks
      tags: [books]
      summary: List / search canonical books
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: List of books
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Book"
    post:
      operationId: createBook
      tags: [books]
      summary: Create a canonical book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookInput"
      responses:
        "201":
          description: Book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"

  /books/google-books:
    get:
      operationId: searchGoogleBooks
      tags: [books]
      summary: Search the Google Books catalog
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 160
          description: A title, author, or ISBN search term
      responses:
        "200":
          description: Matching catalog editions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GoogleBookCatalogItem"
        "400":
          description: Invalid search term
        "502":
          description: Google Books is temporarily unavailable
    post:
      operationId: resolveGoogleBook
      tags: [books]
      summary: Reuse or create a canonical book from a Google Books result
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GoogleBookSelection"
      responses:
        "200":
          description: Existing canonical book reused
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"
        "201":
          description: Canonical book created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Book"

  /books/{bookId}:
    get:
      operationId: getBook
      tags: [books]
      summary: Get a book with its best comments and most-highlighted quotes
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Book detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookDetail"
        "404":
          description: Book not found

  /books/{bookId}/quotes:
    get:
      operationId: getBookQuotes
      tags: [quotes]
      summary: Community quotes for a book (reader overlay)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
          description: Restrict overlay to quotes with activity in this room (viewer must be a member)
      responses:
        "200":
          description: Quotes list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Find or create a quote in a book (by normalized text)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteInput"
      responses:
        "200":
          description: Quote found or created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"

  /quotes/{quoteId}/comments:
    get:
      operationId: getQuoteComments
      tags: [comments]
      summary: Get top-level comments for a quote
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: integer
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [best, friends, all]
            default: all
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
          description: Only comments scoped to this room (viewer must be a member)
      responses:
        "200":
          description: Comments list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createComment
      tags: [comments]
      summary: Create a comment on a quote (parses @mentions and fires notifications)
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /quotes/{quoteId}/highlight:
    post:
      operationId: toggleHighlight
      tags: [quotes]
      summary: Toggle the current user's highlight on a quote
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HighlightInput"
      responses:
        "200":
          description: Highlight toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighlightResult"
    delete:
      operationId: deleteHighlight
      tags: [quotes]
      summary: Delete the current user's highlight on a quote
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Highlight deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HighlightResult"
        "404":
          description: Highlight not found

  /quotes/{quoteId}/reader-context:
    get:
      operationId: getQuoteReaderContext
      tags: [quotes]
      summary: Where to read this quote — its canonical book and my library entry (if any)
      parameters:
        - name: quoteId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Reader context for the quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteReaderContext"
        "404":
          description: Quote not found

  /comments/{commentId}/like:
    post:
      operationId: likeComment
      tags: [comments]
      summary: Like a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"

  /comments/{commentId}/save:
    post:
      operationId: saveComment
      tags: [comments]
      summary: Save/unsave a comment
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Save toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"

  /comments/{commentId}:
    get:
      operationId: getComment
      tags: [comments]
      summary: Get a single comment by id (visibility-gated)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "404":
          description: Comment not found or not visible
    patch:
      operationId: updateComment
      tags: [comments]
      summary: Update the current user's comment or reply
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommentInput"
      responses:
        "200":
          description: Comment updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "403":
          description: Only the author can update this comment
        "404":
          description: Comment not found
    delete:
      operationId: deleteComment
      tags: [comments]
      summary: Delete the current user's comment or reply
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Comment deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "403":
          description: Only the author can delete this comment
        "404":
          description: Comment not found

  /comments/{commentId}/replies:
    get:
      operationId: getCommentReplies
      tags: [comments]
      summary: Get replies to a top-level comment (flat, chronological, visibility-gated)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Replies list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
    post:
      operationId: createReply
      tags: [comments]
      summary: Reply to a top-level comment (max 1 level; parses @mentions and fires notifications)
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentInput"
      responses:
        "201":
          description: Reply created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"

  /library:
    post:
      operationId: createLibraryEntry
      tags: [library]
      summary: Register an uploaded EPUB, extract metadata, and auto-match
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryInput"
      responses:
        "201":
          description: Library entry created with match result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryUploadResult"
        "403":
          description: EPUB must use an unused upload URL issued to the authenticated account
        "409":
          description: The EPUB object is already registered to another account, or account deletion is in progress

  /library/{libraryId}:
    get:
      operationId: getLibraryEntry
      tags: [library]
      summary: Get a library entry (with EPUB url and matched book)
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Library entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"
        "404":
          description: Not found
    patch:
      operationId: matchLibraryEntry
      tags: [library]
      summary: Manually match a library entry to a canonical book
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ManualMatchInput"
      responses:
        "200":
          description: Library entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"

  /library/{libraryId}/location:
    put:
      operationId: updateReadingLocation
      tags: [library]
      summary: Save the reader's last reading location (CFI)
      parameters:
        - name: libraryId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReadingLocationInput"
      responses:
        "200":
          description: Library entry updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryEntry"
        "404":
          description: Not found

  /users/{userId}/library:
    get:
      operationId: getUserLibrary
      tags: [library]
      summary: List a user's uploaded books
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Library entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LibraryEntry"

  /users:
    post:
      operationId: createUser
      tags: [users]
      summary: Sign up a new user; unverified accounts must confirm their email before using the app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "200":
          description: User created; a verification code is sent best-effort when the email is unverified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: Username or email already taken

  /users/login:
    post:
      operationId: loginUser
      tags: [users]
      summary: Log in with username or email and password; unverified emails trigger a best-effort verification code send
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user with bearer token and emailVerified status; a verification code is sent best-effort when emailVerified is false
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid username or password

  /users/{userId}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    delete:
      operationId: deleteUserAccount
      tags: [users]
      summary: Permanently delete the authenticated user's account and owned data
      description: Requires confirmation with the current password. Only the authenticated user may delete their own account. Shared book covers and other users' content are preserved.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteAccountInput"
      responses:
        "200":
          description: Account and account-owned data permanently deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountResult"
        "400":
          description: Invalid request or account has no password credential
        "401":
          description: Unauthorized or current password is incorrect
        "403":
          description: Authenticated user may only delete their own account
        "404":
          description: User not found
        "500":
          description: Account data could not be deleted
        "409":
          description: Account deletion is already in progress

  /users/search:
    get:
      operationId: searchUsers
      tags: [users]
      summary: Search users by username or nickname (viewer taken from bearer token)
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserWithFriendStatus"

  /users/{userId}/friends:
    get:
      operationId: getFriends
      tags: [users]
      summary: Get friends of a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Friends list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: addFriend
      tags: [users]
      summary: Add a friend
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendInput"
      responses:
        "200":
          description: Friend added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/blocked-users:
    get:
      operationId: getBlockedUsers
      tags: [users]
      summary: List accounts blocked by the current user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Blocked accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedUser"

  /users/{userId}/blocks:
    post:
      operationId: blockUser
      tags: [users]
      summary: Block an account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockUserInput"
      responses:
        "200":
          description: Account blocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedUser"
        "400":
          description: Cannot block yourself
        "404":
          description: User not found

  /users/{userId}/blocks/{blockedUserId}:
    delete:
      operationId: unblockUser
      tags: [users]
      summary: Unblock an account
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: blockedUserId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Account unblocked

  /users/{userId}/friends/{friendId}:
    delete:
      operationId: removeFriend
      tags: [users]
      summary: Remove a friend
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: friendId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Friend removed

  /friend-requests:
    post:
      operationId: sendFriendRequest
      tags: [users]
      summary: Send a friend request (requester taken from bearer token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendRequestInput"
      responses:
        "200":
          description: Request created (idempotent — ok even if already pending or already friends)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: Cannot send a friend request to yourself
        "404":
          description: Recipient not found

  /reports:
    post:
      operationId: reportContent
      tags: [moderation]
      summary: Report a comment, highlight, or user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportContentInput"
      responses:
        "200":
          description: Report received, including an already-submitted report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportContentResult"
        "404":
          description: Content not found or not visible to the reporter

  /moderation/access:
    get:
      operationId: getModerationAccess
      tags: [moderation]
      summary: Check whether the authenticated user can moderate reports
      responses:
        "200":
          description: Moderation access for the authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModeratorAccess"

  /moderation/reports:
    get:
      operationId: getModerationReports
      tags: [moderation]
      summary: List reports for moderators
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, reviewing, resolved, dismissed]
            default: open
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: Reports matching the selected status
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ModerationReport"
        "403":
          description: Moderator access required

  /moderation/reports/{reportId}:
    patch:
      operationId: updateModerationReport
      tags: [moderation]
      summary: Update a report's moderation status
      parameters:
        - name: reportId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ModerateReportInput"
      responses:
        "200":
          description: Report status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerateReportResult"
        "403":
          description: Moderator access required
        "404":
          description: Report not found

  /friend-requests/{requesterId}/accept:
    post:
      operationId: acceptFriendRequest
      tags: [users]
      summary: Accept a pending friend request sent to the authenticated user
      parameters:
        - name: requesterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request accepted — both users now follow each other
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: No pending request from this user

  /friend-requests/{requesterId}/decline:
    post:
      operationId: declineFriendRequest
      tags: [users]
      summary: Decline a pending friend request sent to the authenticated user
      parameters:
        - name: requesterId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request declined (removed; the requester may request again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: No pending request from this user

  /users/{userId}/saved-comments:
    get:
      operationId: getSavedComments
      tags: [users]
      summary: Get saved comments for a user
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Saved comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"

  /users/{userId}/records:
    get:
      operationId: getUserRecords
      tags: [users]
      summary: My records grouped by book (my highlight/comment/saved counts; self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Per-book record summaries, most recent activity first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserRecordsBook"

  /users/{userId}/records/{bookId}:
    get:
      operationId: getUserBookRecords
      tags: [users]
      summary: My highlights, comments, and saved comments for one book (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: My records for this book
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserBookRecords"
        "404":
          description: Book not found

  /users/{userId}/highlights:
    get:
      operationId: getUserHighlights
      tags: [users]
      summary: All my highlights across books, newest first (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: My highlights, chronological (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserHighlightItem"

  /users/{userId}/profile:
    get:
      operationId: getUserProfile
      tags: [users]
      summary: Get a user's public profile with follower/following and activity counts
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "404":
          description: Not found

  /users/{userId}/settings:
    patch:
      operationId: updateUserSettings
      tags: [users]
      summary: Update the current user's personal settings
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserSettings"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [users]
      summary: Request a password reset code by email (unauthenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequestInput"
      responses:
        "200":
          description: If the email is registered and verified, a reset code has been sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "429":
          description: Reset email sent too recently — wait before retrying
        "502":
          description: Email delivery failed

  /users/password-reset/confirm:
    post:
      operationId: confirmPasswordReset
      tags: [users]
      summary: Reset the password using the emailed code (unauthenticated)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmInput"
      responses:
        "200":
          description: Password reset — returns the authenticated user with a new bearer token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or expired reset code

  /users/{userId}/verify-email/send:
    post:
      operationId: sendVerificationEmail
      tags: [users]
      summary: Send (or resend) the email verification code (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Verification email sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: No email on account, or email already verified
        "429":
          description: Sent too recently — wait before resending
        "502":
          description: Email delivery failed

  /users/{userId}/verify-email/confirm:
    post:
      operationId: confirmEmailVerification
      tags: [users]
      summary: Confirm the 6-digit email verification code (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailInput"
      responses:
        "200":
          description: Email verified — returns the updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid or expired code

  /users/{userId}/avatar/upload-url:
    post:
      operationId: getAvatarUploadUrl
      tags: [users]
      summary: Get a presigned URL to upload a profile photo (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Presigned upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvatarUploadUrl"
        "409":
          description: Account deletion is in progress

  /users/{userId}/avatar:
    put:
      operationId: setAvatar
      tags: [users]
      summary: Set the profile photo after uploading it (self only)
      description: The image must use a presigned upload URL issued to this account; arbitrary public object paths are rejected.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetAvatarInput"
      responses:
        "200":
          description: Updated user with the new avatarUrl
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "403":
          description: Avatar upload was not issued to the authenticated account
    delete:
      operationId: removeAvatar
      tags: [users]
      summary: Remove the profile photo (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Updated user with avatarUrl cleared
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{userId}/notifications:
    get:
      operationId: getNotifications
      tags: [users]
      summary: Get notifications for a user (newest first, limit 50)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification list with unread count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"

  /users/{userId}/notifications/read-all:
    put:
      operationId: markNotificationsRead
      tags: [users]
      summary: Mark all notifications as read
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unread count after marking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"

  /notifications/{notificationId}/read:
    put:
      operationId: markNotificationRead
      tags: [users]
      summary: Mark a single notification as read (must belong to the authenticated user)
      parameters:
        - name: notificationId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Unread count after marking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnreadCount"
        "404":
          description: Notification not found

  /users/{userId}/push-tokens:
    post:
      operationId: registerPushToken
      tags: [users]
      summary: Register an Expo push token for the user (upsert; reassigns the token on account switch)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "200":
          description: Token registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
    delete:
      operationId: unregisterPushToken
      tags: [users]
      summary: Unregister an Expo push token for the user (e.g. on logout)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "200":
          description: Token unregistered (idempotent)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /feedback:
    post:
      operationId: submitFeedback
      tags: [users]
      summary: Submit in-app feedback or a bug report (author taken from bearer token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Feedback stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"

  /highlights/{highlightId}/like:
    post:
      operationId: likeHighlight
      tags: [quotes]
      summary: Toggle a like on a highlight (liker taken from bearer token)
      parameters:
        - name: highlightId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Like toggled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LikeResult"
        "404":
          description: Highlight not found

  /users/{userId}/notification-settings:
    get:
      operationId: getNotificationSettings
      tags: [users]
      summary: Get the current user's per-type notification settings (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"
    put:
      operationId: updateNotificationSettings
      tags: [users]
      summary: Update the current user's per-type notification settings (self only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSettings"
      responses:
        "200":
          description: Updated notification settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationSettings"

  /feed:
    get:
      operationId: getFeed
      tags: [users]
      summary: Comment feed of users I follow (newest first, viewer taken from bearer token)
      parameters:
        - name: roomId
          in: query
          required: false
          schema:
            type: integer
          description: Restrict the feed to activity in this reading room (viewer must be a member).
        - name: cursor
          in: query
          required: false
          schema:
            type: string
          description: Opaque cursor from a previous page's nextCursor. Omit for the first page.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        "200":
          description: Feed page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedPage"

  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: Search / browse public reading rooms (by room name or book title)
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Public rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a reading room (creator becomes the owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRoomInput"
      responses:
        "201":
          description: Room created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Book not found

  /rooms/trending:
    get:
      operationId: getTrendingRooms
      tags: [rooms]
      summary: Trending public rooms (recent member growth + comment activity)
      responses:
        "200":
          description: Trending rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /rooms/mine:
    get:
      operationId: getMyRooms
      tags: [rooms]
      summary: Rooms the authenticated user is a member of
      parameters:
        - name: bookId
          in: query
          required: false
          schema:
            type: integer
          description: Only my rooms for this canonical book (reader scope picker)
      responses:
        "200":
          description: My rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Room home — book, members with reading progress, viewer state
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomDetail"
        "404":
          description: Room not found (or private and viewer is neither member nor invitee)
    patch:
      operationId: updateRoom
      tags: [rooms]
      summary: Update room name/description/privacy (owner only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRoomInput"
      responses:
        "200":
          description: Room updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "403":
          description: Only the owner can update the room
        "404":
          description: Room not found

  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a public room (idempotent; archived rooms cannot be joined)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "403":
          description: Private room — invite required
        "404":
          description: Room not found or archived and no longer joinable

  /rooms/{roomId}/share-link:
    post:
      operationId: createRoomShareLink
      tags: [rooms]
      summary: Get or create the active private-room share link (members only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Stable share token for the private room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomShareLink"
        "403":
          description: Only a room member can create or retrieve its share link
        "404":
          description: Room not found or archived
    delete:
      operationId: revokeRoomShareLink
      tags: [rooms]
      summary: Revoke the active private-room share link (owner only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Share link revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "403":
          description: Only the room owner can revoke its share link
        "404":
          description: Room not found

  /rooms/join-by-share-link:
    post:
      operationId: joinRoomByShareLink
      tags: [rooms]
      summary: Join a private room using its share-link token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JoinRoomByShareLinkInput"
      responses:
        "200":
          description: Joined the room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinRoomByShareLinkResponse"
        "404":
          description: Share link is invalid, revoked, or the room is archived

  /rooms/{roomId}/leave:
    post:
      operationId: leaveRoom
      tags: [rooms]
      summary: Leave a room (the owner cannot leave their own room)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Left
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "400":
          description: The owner cannot leave their own room
        "404":
          description: Not a member

  /rooms/{roomId}/members/{userId}:
    delete:
      operationId: removeRoomMember
      tags: [rooms]
      summary: Remove a member from the room (owner only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "403":
          description: Only the owner can remove members
        "404":
          description: Room or member not found

  /rooms/{roomId}/invites:
    post:
      operationId: inviteToRoom
      tags: [rooms]
      summary: Invite a friend to the room (member or owner; idempotent while pending)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInviteInput"
      responses:
        "200":
          description: Invite sent (or already pending / already a member)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "403":
          description: Only room members or the owner can invite
        "404":
          description: Room or user not found

  /rooms/{roomId}/invites/accept:
    post:
      operationId: acceptRoomInvite
      tags: [rooms]
      summary: Accept a pending invite to this room (invitee only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite accepted — you are now a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: No pending invite for this room

  /rooms/{roomId}/invites/decline:
    post:
      operationId: declineRoomInvite
      tags: [rooms]
      summary: Decline a pending invite to this room (invitee only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Invite declined (removed; you can be invited again)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResult"
        "404":
          description: No pending invite for this room

  /rooms/{roomId}/feed:
    get:
      operationId: getRoomFeed
      tags: [rooms]
      summary: Latest room-scoped comments (members only)
      parameters:
        - name: roomId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room activity feed, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RoomFeedItem"
        "403":
          description: Members only
        "404":
          description: Room not found

  /users/{userId}/rooms:
    get:
      operationId: getUserRooms
      tags: [users]
      summary: Public rooms the given user is a member of
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rooms the user belongs to
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

  /books/{bookId}/rooms:
    get:
      operationId: getBookRooms
      tags: [rooms]
      summary: Public rooms for a book (plus the viewer's own rooms for it)
      parameters:
        - name: bookId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Rooms for this book
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Book:
      type: object
      required: [id, title, author, description, coverColor, coverUrl, quoteCount, commentCount, highlightCount]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        description:
          type: string
        coverColor:
          type: string
        coverUrl:
          type: [string, "null"]
          description: Public object path of the cover image extracted from an uploaded EPUB, or null for a color cover
        quoteCount:
          type: integer
        commentCount:
          type: integer
        highlightCount:
          type: integer

    GoogleBookCatalogItem:
      type: object
      required: [title, author, isbn, coverUrl, publisher, publishedDate, description, pageCount, language]
      properties:
        title:
          type: string
        author:
          type: string
        isbn:
          type: [string, "null"]
        coverUrl:
          type: [string, "null"]
          format: uri
          description: HTTPS cover image URL from the Google Books catalog
        publisher:
          type: [string, "null"]
        publishedDate:
          type: [string, "null"]
        description:
          type: [string, "null"]
        pageCount:
          type: [integer, "null"]
          minimum: 1
        language:
          type: [string, "null"]

    GoogleBookSelection:
      type: object
      required: [title, author]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        author:
          type: string
          minLength: 1
          maxLength: 300
        isbn:
          type: [string, "null"]
          maxLength: 32

    Quote:
      type: object
      required: [id, canonicalBookId, text, searchText, highlightCount, commentCount, highlightIntensity]
      properties:
        id:
          type: integer
        canonicalBookId:
          type: integer
        text:
          type: string
        searchText:
          type: string
          description: Distinctive leading substring used to locate the quote in an EPUB
        highlightCount:
          type: integer
        commentCount:
          type: integer
        highlightIntensity:
          type: number
          description: 0.0 to 1.0 representing community highlight strength
        highlightedByMe:
          type: boolean

    QuoteReaderContext:
      type: object
      required: [quoteId, canonicalBookId, quoteText, searchText, libraryId]
      properties:
        quoteId:
          type: integer
        canonicalBookId:
          type: integer
        quoteText:
          type: string
        searchText:
          type: string
          description: Distinctive leading substring used to locate the quote in an EPUB
        libraryId:
          type: [integer, "null"]
          description: The viewer's library entry for this book, or null if not in their library

    BookDetail:
      type: object
      required: [id, title, author, description, coverColor, coverUrl, quoteCount, commentCount, highlightCount, topQuotes, bestComments]
      properties:
        id:
          type: integer
        title:
          type: string
        author:
          type: string
        description:
          type: string
        coverColor:
          type: string
        coverUrl:
          type: [string, "null"]
          description: Public object path of the cover image extracted from an uploaded EPUB, or null for a color cover
        quoteCount:
          type: integer
        commentCount:
          type: integer
        highlightCount:
          type: integer
        topQuotes:
          type: array
          items:
            $ref: "#/components/schemas/Quote"
        bestComments:
          type: array
          items:
            $ref: "#/components/schemas/Comment"

    Comment:
      type: object
      required: [id, quoteId, userId, username, nickname, avatarUrl, avatarColor, text, visibility, likeCount, likedByMe, savedByMe, replyCount, containsSpoilers, roomId, authorProgress, createdAt]
      properties:
        id:
          type: integer
        quoteId:
          type: integer
        userId:
          type: integer
        username:
          type: string
        nickname:
          type: [string, "null"]
        avatarUrl:
          type: [string, "null"]
        avatarColor:
          type: string
        text:
          type: string
        visibility:
          $ref: "#/components/schemas/ContentVisibility"
        quoteText:
          type: string
        likeCount:
          type: integer
        likedByMe:
          type: boolean
        savedByMe:
          type: boolean
        replyCount:
          type: integer
          description: Number of visible replies (0 for replies themselves)
        parentId:
          type: [integer, "null"]
          description: ID of the parent comment for replies; null for top-level comments
        containsSpoilers:
          type: boolean
          description: Author-flagged spoiler; clients blur the text for other users until tapped
        roomId:
          type: [integer, "null"]
          description: Non-null when the comment is scoped to a reading room (members only)
        authorProgress:
          type: [integer, "null"]
          description: Author's reading progress (0-100) when writing; null when unknown or not room-scoped
        createdAt:
          type: string
          format: date-time

    CommentInput:
      type: object
      required: [text]
      properties:
        text:
          type: string
          minLength: 1
        visibility:
          $ref: "#/components/schemas/ContentVisibility"
        containsSpoilers:
          type: boolean
          description: Mark this comment as containing spoilers (default false)
        roomId:
          type: integer
          description: Scope this comment to a reading room (author must be a member)
        authorProgress:
          type: integer
          minimum: 0
          maximum: 100
          description: Author's reading progress when writing (room spoiler guard)

    UpdateCommentInput:
      type: object
      required: [text, visibility, containsSpoilers]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 500
        visibility:
          $ref: "#/components/schemas/ContentVisibility"
        containsSpoilers:
          type: boolean

    CreateQuoteInput:
      type: object
      required: [text]
      properties:
        text:
