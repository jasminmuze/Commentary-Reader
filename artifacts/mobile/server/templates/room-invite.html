<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#f9f6f0" />
    <title>Join a Shelfmates reading room</title>
    <style>
      * { box-sizing: border-box; }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 20px;
        display: grid;
        place-items: center;
        background: #f9f6f0;
        color: #26231f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 440px);
        padding: 34px 28px;
        border: 1px solid #e5ded2;
        border-radius: 20px;
        background: #fffdf9;
        box-shadow: 0 18px 50px rgba(58, 43, 26, 0.08);
        text-align: center;
      }
      .mark {
        width: 52px;
        height: 52px;
        margin: 0 auto 22px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: #ff3c00;
        color: #fff;
      }
      .mark svg { width: 26px; height: 26px; }
      .eyebrow {
        margin: 0 0 10px;
        color: #b44420;
        font-size: 11px;
        font-weight: 750;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(27px, 7vw, 34px);
        line-height: 1.12;
        letter-spacing: -0.03em;
      }
      .description {
        max-width: 320px;
        margin: 14px auto 24px;
        color: #716b63;
        font-size: 15px;
        line-height: 1.55;
      }
      .button {
        width: 100%;
        min-height: 48px;
        padding: 13px 18px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 12px;
        background: #ff3c00;
        color: white;
        font-size: 15px;
        font-weight: 700;
        text-decoration: none;
      }
      .button:focus-visible, .store-link:focus-visible {
        outline: 3px solid #26231f;
        outline-offset: 3px;
      }
      .install {
        margin-top: 28px;
        padding-top: 22px;
        border-top: 1px solid #eee8df;
      }
      .install-title {
        margin: 0 0 12px;
        font-size: 13px;
        font-weight: 700;
      }
      .store-links {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .store-link {
        min-height: 44px;
        padding: 11px 14px;
        border: 1px solid #ded7cc;
        border-radius: 10px;
        color: #38332d;
        font-size: 14px;
        font-weight: 650;
        text-decoration: none;
      }
      .install-note, .privacy-note {
        color: #827a70;
        font-size: 12px;
        line-height: 1.5;
      }
      .install-note { margin: 12px 0 0; }
      .privacy-note { margin: 22px 0 0; }
      @media (prefers-color-scheme: dark) {
        body { background: #1d1b18; color: #f5f0e9; }
        main { background: #292621; border-color: #3c3831; }
        .description, .install-note, .privacy-note { color: #b6afa4; }
        .install { border-color: #413c34; }
        .store-link { border-color: #514b42; color: #f5f0e9; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5z" />
          <path d="M4 5.5v16M8 7h8M8 11h7" />
        </svg>
      </div>
      <p class="eyebrow">Shelfmates · Group reading</p>
      <h1>A reading room is waiting for you</h1>
      <p class="description">
        Open this invitation in Shelfmates to read and talk about the book together.
      </p>
      <a id="open-app" class="button" href="#">Open Shelfmates</a>
      <section class="install" aria-label="Install Shelfmates">
        <p class="install-title">Don't have Shelfmates yet?</p>
        <div id="store-links" class="store-links"></div>
        <p id="install-note" class="install-note"></p>
      </section>
      <p class="privacy-note">
        Anyone with a private-room invitation link can join. The room owner can revoke it.
      </p>
    </main>
    <script>
      const invite = ROOM_INVITE_DATA;
      const openButton = document.getElementById("open-app");
      openButton.href = invite.appUrl;

      const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      const isAndroid = /Android/i.test(navigator.userAgent);
      const links = [];
      if (isIOS && invite.iosInstallUrl) {
        links.push(["Install for iPhone", invite.iosInstallUrl]);
      } else if (isAndroid && invite.androidInstallUrl) {
        links.push(["Install for Android", invite.androidInstallUrl]);
      } else {
        if (invite.iosInstallUrl) links.push(["Install for iPhone", invite.iosInstallUrl]);
        if (invite.androidInstallUrl) links.push(["Install for Android", invite.androidInstallUrl]);
      }

      const storeLinks = document.getElementById("store-links");
      links.forEach(([label, href]) => {
        const link = document.createElement("a");
        link.className = "store-link";
        link.href = href;
        link.textContent = label;
        storeLinks.appendChild(link);
      });
      if (links.length === 0) {
        document.getElementById("install-note").textContent =
          "App Store and Android download links will appear here when they are available.";
      }
    </script>
  </body>
</html>
